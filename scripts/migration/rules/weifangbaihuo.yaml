customer: 潍坊百货
slug: weifangbaihuo

# 手工区列名映射
column_mapping:
  是否还需开票: billing_status_hint  # 辅助列，不直接使用
  是否开票: billing_status
  拆分: split_note
  发票号: invoice_no
  红票勾选台数: extra_fields.红票勾选台数
  开票日期: invoice_date
  红通号: extra_fields.红通号
  备注: remark

# 状态值映射
status_mapping:
  已开: billed
  111: billed
  手工标识已开: billed
  25年已开: billed
  26年已开: billed
  前期已开: billed
  未开: unbilled
  未开确定: unbilled
  已拆分: split
  未开明细无:一定已开: billed

# 特殊处理规则
special_rules:
  - pattern: "重复开具：(.+)"
    action: "billing_status=billed, remark=重复开具：\\1"
